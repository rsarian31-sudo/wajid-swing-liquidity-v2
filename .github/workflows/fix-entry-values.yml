name: Fix zero trade values in UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: prevent zero trade values') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = "$('entry').textContent=active&&plan?fmt(plan.entry):'—'; $('sl').textContent=active&&plan?fmt(plan.stopLoss):'—'; $('tp1').textContent=active&&plan?fmt(plan.tp1):'—'; $('tp2').textContent=active&&plan?fmt(plan.tp2):'—'; $('tp3').textContent=active&&plan?fmt(plan.tp3):'—'; $('risk').textContent=active&&plan?fmt(plan.risk):'—';\n    setFlat(entrySeries,candles,active&&plan?plan.entry:null); setFlat(stopSeries,candles,active&&plan?plan.stopLoss:null); setFlat(tp2Series,candles,active&&plan?plan.tp2:null);"
          new = "const validPlan = Boolean(active && plan && [plan.entry, plan.stopLoss, plan.tp1, plan.tp2, plan.tp3].every(v => Number.isFinite(Number(v)) && Number(v) > 0));\n    $('entry').textContent=validPlan?fmt(plan.entry):'—'; $('sl').textContent=validPlan?fmt(plan.stopLoss):'—'; $('tp1').textContent=validPlan?fmt(plan.tp1):'—'; $('tp2').textContent=validPlan?fmt(plan.tp2):'—'; $('tp3').textContent=validPlan?fmt(plan.tp3):'—'; $('risk').textContent=validPlan?fmt(plan.risk):'—';\n    setFlat(entrySeries,candles,validPlan?plan.entry:null); setFlat(stopSeries,candles,validPlan?plan.stopLoss:null); setFlat(tp2Series,candles,validPlan?plan.tp2:null);"
          if old not in s:
              raise SystemExit('Target UI block not found; refusing to modify app.js')
          if 'const validPlan = Boolean(active && plan' in s:
              raise SystemExit('Fix already present')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/fix-entry-values.yml
          git commit -m 'fix: prevent zero trade values'
          git push
