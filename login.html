<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGIN · Wajid Swing Liquidity</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030810;color:#eaf1f8;font:14px Inter,system-ui,sans-serif;display:grid;place-items:center}.auth{width:min(430px,calc(100% - 28px))}.brand{text-align:center;font-weight:800;font-size:23px;letter-spacing:.7px;margin-bottom:18px}.brand span{color:#1594ff}.card{background:linear-gradient(145deg,#081623,#050e18);border:1px solid #16405e;border-radius:16px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.eyebrow{font-size:10px;letter-spacing:1px;color:#6f9bbb}.card h1{margin:8px 0;font-size:27px}.card p{color:#8195a8;line-height:1.6;margin:0 0 20px}label{display:block;color:#9cb0c1;font-size:11px;margin:12px 0}input{display:block;width:100%;margin-top:6px;padding:12px;border-radius:9px;border:1px solid #1c3f59;background:#071522;color:#fff;outline:none}input:focus{border-color:#168fff}button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:#128df2;color:#fff;font-weight:800;cursor:pointer}#msg{min-height:22px;margin-top:12px;color:#ff7d8d;font-size:12px}.switch{text-align:center;color:#72879a;margin-top:18px;font-size:12px}.switch a{color:#35a7ff;text-decoration:none;font-weight:700}</style></head><body><main class="auth"><div class="brand">WAJID <span>SWING LIQUIDITY</span></div><div class="card"><div class="eyebrow">MEMBER LOGIN</div><h1>Welcome back</h1><p>Login to view your trading performance. Live signals require an active subscription.</p><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button>LOGIN</button><div id="msg"></div></form><div class="switch">Don't have an account? <a href="/register.html">Create account</a></div></div></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Working…';const body={email:document.getElementById('email').value.trim(),password:document.getElementById('password').value};try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');location.replace('/')}catch(err){msg.textContent=err.message||'Request failed'}});</script></body></html>
